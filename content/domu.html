  <section class="panel active" id="panel-domu"></section>

<script>
  // ===== Zpětná kompatibilita: staré odkazy z jednostránkového webu =====
  // (viz ARCHITEKTURA-MIGRACE.md, 2.3). Odkazy typu pecky.online/#pozemky
  // mohly být nasdílené na Facebooku, v novinách apod. — po migraci na
  // vícestránkovou strukturu je potřeba je poslat na novou adresu. Root
  // index.html (Domů) je jediné místo, kam takový starý odkaz vůbec může
  // dorazit (hash na kořenové doméně), takže redirect žije právě tady.
  (function(){
    // BASE: prefix pro nasazení na GitHub Pages subcestě (viz SITE_BASE_PATH
    // ve scripts/build.py, injektováno jako window.SITE_BASE_PATH v
    // templates/page.html) - '' na vlastní doméně, jinak např. '/pecky.online'.
    var BASE = window.SITE_BASE_PATH;
    var OLD_TO_NEW = {
      domu: BASE + '/', jednani: BASE + '/jednani/', zpravodaj: BASE + '/noviny/', lide: BASE + '/lide/',
      plan: BASE + '/plan/', volby2018: BASE + '/volby/2018/', volby2022: BASE + '/volby/2022/',
      volby2026: BASE + '/volby/2026/', smlouvy: BASE + '/smlouvy/', zakazky: BASE + '/zakazky/',
      pozemky: BASE + '/pozemky/', pokladna: BASE + '/pokladna/', owebu: BASE + '/o-webu/'
    };
    var hash = window.location.hash.replace(/^#/, '');
    if (!hash) return;
    var panel = hash.split(/[/?]/)[0];
    if (!Object.prototype.hasOwnProperty.call(OLD_TO_NEW, panel)) return;
    var target = OLD_TO_NEW[panel];
    if (target === BASE + '/') {
      // #domu na kořenové stránce - obsah je už správně zobrazený, jen smazat hash z URL
      if (hash === 'domu') history.replaceState(null, '', BASE + '/');
      return;
    }
    // podcesta/parametry za jménem panelu (např. #lide/osoba/paluskam?scope=all)
    // se zachovávají celé, včetně jména panelu - Lidé si svoje vnitřní
    // směrování (#lide/...) po migraci ponechaly beze změny
    var hasSubpath = hash.length > panel.length;
    window.location.replace(target + (hasSubpath ? '#' + hash : ''));
  })();
</script>
