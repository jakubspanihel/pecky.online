  <section class="panel active" id="panel-peckybot">
    <a class="overlay-close" href="/" aria-label="Zavřít a přejít na hlavní stránku">Zavřít</a>

    <div class="pb-chat" id="pb-chat">
      <div class="pb-log" id="pb-log" role="log" aria-live="polite" aria-label="Konverzace s PečkyBotem">
        <div class="pb-msg pb-bot">
          <img class="pb-avatar" src="/img/peckybot/welcome.png" alt="" width="44" height="44">
          <div class="pb-bubble pb-welcome">Ahoj, já jsem PečkyBot.</div>
        </div>
      </div>

      <h3 class="search-status" id="pb-status" hidden><span class="spinner" aria-hidden="true"></span>PečkyBot hledá ve zdrojích…</h3>

      <div class="pb-examples" id="pb-examples">
        <button type="button" class="pb-chip">Jak to vypadá se stavbou tělocvičny?</button>
        <button type="button" class="pb-chip">Co naposledy řešila Rada města?</button>
        <button type="button" class="pb-chip">O čem se mluvilo na posledním zastupitelstvu?</button>
        <button type="button" class="pb-chip">Jak se vyvíjela cena vody?</button>
        <button type="button" class="pb-chip">Co je nového na úřední desce?</button>
      </div>

      <form class="pb-form" id="pb-form" autocomplete="off">
        <div class="pb-row">
          <input type="text" id="pb-input" aria-label="Váš dotaz" maxlength="600" placeholder="Napište otázku…" required>
          <button type="submit" id="pb-send" class="pb-send">Odeslat</button>
        </div>
        <p class="pb-privacy">Dotazy se anonymně ukládají 90 dní, aby bylo možné zlepšovat odpovědi. Neukládá se IP adresa. Nezadávejte osobní údaje.</p>
      </form>
    </div>
  </section>

  <style>
    a.overlay-close{display:inline-block; text-decoration:none;}
    #panel-peckybot{padding-top:44px; padding-bottom:80px;}
    .pb-chat{margin-top:18px; max-width:760px; display:flex; flex-direction:column; min-height:calc(100vh - 230px);}
    .pb-log{display:flex; flex-direction:column; gap:14px; margin-bottom:16px;}
    .pb-msg{display:flex; gap:12px; align-items:flex-start;}
    .pb-msg.pb-user{flex-direction:row-reverse;}
    .pb-avatar{flex:0 0 44px; width:44px; height:44px; object-fit:contain;}
    .pb-bubble{background:var(--material); border:1px solid var(--line); border-radius:6px; padding:11px 15px; font-size:15px; line-height:1.55; color:var(--ink); max-width:100%; overflow-wrap:anywhere;}
    .pb-user .pb-bubble{background:var(--material-deep);}
    .pb-error .pb-bubble{border-color:var(--burgundy); background:rgba(189,37,63,0.06);}
    .pb-bubble.pb-welcome{font-size:22px; line-height:1.4; padding:14px 20px;}
    .pb-bubble mark.pb-kc{background:#fff2a8; color:inherit; padding:0 3px; border-radius:3px; white-space:nowrap;}
    .pb-bubble p{margin:0 0 8px;}
    .pb-bubble p:last-child{margin-bottom:0;}
    .pb-bubble ul,.pb-bubble ol{margin:0 0 8px; padding-left:20px;}
    .pb-bubble li{margin:0 0 4px;}
    .pb-bubble ul.pb-zdroje{list-style:none; padding-left:0;}
    .pb-bubble a.pb-ref{font-size:12px; vertical-align:super; text-decoration:none; font-weight:600; padding:0 1px;}
    .pb-zdroje{margin:10px 0 0; padding:8px 0 0; border-top:1px solid var(--line); font-size:13px; color:var(--ink-soft); list-style:none;}
    .pb-zdroje li{margin:2px 0;}
    .pb-examples{display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin:auto 0 14px; padding-top:16px;}
    .pb-chip{font:inherit; font-size:16px; padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:var(--material); color:var(--ink); cursor:pointer; text-align:left;}
    .pb-chip:hover{border-color:var(--burgundy); color:var(--burgundy);}
    .pb-form{position:fixed; z-index:100; left:0; right:0; bottom:0; padding:12px 16px; background:var(--material-deep); border-top:1px solid var(--line);}
    .pb-privacy{max-width:760px; margin:6px auto 0; font-size:12px; line-height:1.4; color:var(--ink-soft);}
    .pb-vote{display:flex; align-items:center; gap:6px; margin:10px 0 0; font-size:13px; color:var(--ink-soft);}
    .pb-vote button{font:inherit; font-size:15px; line-height:1; padding:4px 9px; border:1px solid var(--line); border-radius:14px; background:var(--material); color:var(--ink); cursor:pointer;}
    .pb-vote button:hover, .pb-vote button:focus-visible{border-color:var(--burgundy);}
    .pb-vote button[disabled]{opacity:.55; cursor:default;}
    .pb-vote button[aria-pressed="true"]{background:var(--burgundy); border-color:var(--burgundy); color:#fff;}
    .pb-row{display:flex; gap:8px; max-width:760px; margin:0 auto;}
    .pb-row input{flex:1; min-width:0; font:inherit; font-size:15px; padding:9px 12px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink);}
    .pb-send{font:inherit; font-size:15px; font-weight:600; padding:9px 18px; border:0; border-radius:4px; background:var(--burgundy); color:#fff; cursor:pointer;}
    .pb-send:hover{filter:brightness(1.15);}
    .pb-send[disabled]{opacity:.55; cursor:default; filter:none;}
    #pb-status[hidden], .pb-examples[hidden]{display:none;}
  </style>

  <script>
  (function () {
    var log = document.getElementById('pb-log');
    var form = document.getElementById('pb-form');
    var input = document.getElementById('pb-input');
    var send = document.getElementById('pb-send');
    var status = document.getElementById('pb-status');
    var examples = document.getElementById('pb-examples');
    var history = [];
    var apiUrl = null;
    var busy = false;

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    function addMsg(kind, html, img) {
      var d = document.createElement('div');
      d.className = 'pb-msg ' + (kind === 'user' ? 'pb-user' : 'pb-bot') + (kind === 'error' ? ' pb-error' : '');
      d.innerHTML = (kind === 'user' ? '' : '<img class="pb-avatar" src="/img/peckybot/' + (img || 'welcome') + '.png" alt="" width="44" height="44">') +
        '<div class="pb-bubble">' + html + '</div>';
      log.appendChild(d);
      d.scrollIntoView({block: 'nearest', behavior: 'smooth'});
      return d;
    }

    // Graf ceníku vodného a stočného pod odpovědí, když odpověď cituje zdroj o ceně vody (data: /voda/ceny.json).
    function vodaGraf(el) {
      fetch('/voda/ceny.json').then(function (r) { return r.json(); }).then(function (d) {
        var asc = d.years.filter(function (y) { return y.items.celkem.s_dph != null; }).sort(function (a, b) { return a.year - b.year; });
        if (asc.length < 2) return;
        var S = [{k: 'celkem', l: 'Celkem', c: 'var(--burgundy)'}, {k: 'vodne', l: 'Vodné', c: 'var(--cyan-deep)'}, {k: 'stocne', l: 'Stočné', c: 'var(--ink-soft)'}];
        var W = 640, H = 280, L = 48, R = 56, T = 22, B = 30, y0 = asc[0].year, y1 = asc[asc.length - 1].year, max = 0;
        asc.forEach(function (y) { max = Math.max(max, y.items.celkem.s_dph); });
        var top = Math.ceil(max / 40) * 40;
        function X(yr) { return L + (yr - y0) * (W - L - R) / (y1 - y0); }
        function Y(v) { return T + (1 - v / top) * (H - T - B); }
        var o = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;font-size:12px;" role="img" aria-label="Graf vývoje ceny vodného, stočného a celkové ceny s DPH podle let">';
        for (var v = 0; v <= top; v += 40) o += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)"/><text x="' + (L - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end" fill="var(--ink-soft)">' + v + '</text>';
        o += '<text x="' + L + '" y="' + (T - 10) + '" fill="var(--ink-soft)">Kč/m³ s DPH</text>';
        for (var yr = y0; yr <= y1; yr++) if ((y1 - yr) % 2 === 0) o += '<text x="' + X(yr) + '" y="' + (H - 8) + '" text-anchor="middle" fill="var(--ink-soft)">' + yr + '</text>';
        S.forEach(function (se) {
          var pts = asc.filter(function (y) { return y.items[se.k].s_dph != null; });
          for (var i = 1; i < pts.length; i++) o += '<line x1="' + X(pts[i - 1].year) + '" y1="' + Y(pts[i - 1].items[se.k].s_dph) + '" x2="' + X(pts[i].year) + '" y2="' + Y(pts[i].items[se.k].s_dph) + '" stroke="' + se.c + '" stroke-width="2.5"' + (pts[i].year - pts[i - 1].year > 1 ? ' stroke-dasharray="2 6" stroke-linecap="round"' : '') + '/>';
          pts.forEach(function (y) { o += '<circle cx="' + X(y.year) + '" cy="' + Y(y.items[se.k].s_dph) + '" r="3.5" fill="' + se.c + '"><title>' + se.l + ' ' + y.year + ': ' + y.items[se.k].s_dph.toFixed(2).replace('.', ',') + ' Kč/m³ s DPH</title></circle>'; });
          var la = pts[pts.length - 1];
          o += '<text x="' + (X(la.year) + 8) + '" y="' + (Y(la.items[se.k].s_dph) + 4) + '" fill="' + se.c + '" font-weight="700">' + la.items[se.k].s_dph.toFixed(2).replace('.', ',') + '</text>';
        });
        o += '</svg>';
        var leg = S.map(function (se) { return '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + se.c + ';margin-right:6px;"></span>' + se.l + '</span>'; }).join('');
        var b = el.querySelector('.pb-bubble'), z = b.querySelector('.pb-zdroje'), w = document.createElement('div');
        w.innerHTML = '<h4 style="margin:12px 0 4px;">Vývoj ceny vody s DPH</h4>' + o + '<div class="chart-legend">' + leg + '<span>Tečkovaná čára = roky bez údaje</span></div>';
        b.insertBefore(w, z);
      }).catch(function () {});
    }

    // Odpověď modelu: jednoduché formátování (tučné **x**, kurzíva *x*, odrážky „- “, číslovaný seznam „1. “)
    // a odkazy na zdroje ve tvaru [n]. Text se nejdřív escapuje, takže se nikdy nevkládá cizí HTML.
    function renderAnswer(text, sources) {
      var byN = {};
      sources.forEach(function (s) { byN[s.n] = s; });
      // Text mimo značky (HTML už je escapované): odkazy na parcely a zvýraznění částek.
      var KC_RE = /(\d{1,3}(?:[ \u00a0.]\d{3})+(?:,\d+)?|\d+(?:,\d+)?)(?:[ \u00a0]*(?:mil|mld|tis)\.?)?[ \u00a0]*(?:Kč|CZK|korun)(?![\p{L}])(?:[ \u00a0]*\/[ \u00a0]*m[²2])?(?:[ \u00a0]+(?:bez|s)[ \u00a0]DPH)?/gu;
      var PARC_RE = /(parc\.?[ \u00a0]*)(\d{1,5}(?:\/\d{1,3})?)((?:(?:[ \u00a0]+v|[ \u00a0]*[(\u2013\u2014-]|[ \u00a0]*,)?[ \u00a0]*k\.?[ \u00a0]*ú\.?[ \u00a0]*)([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][\p{L}]+(?:[ \u00a0][A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][\p{L}]+)?))?/gu;
      var LV_RE = /\bLV[ \u00a0]*(\d+)/g;
      var KAT_RE = /k\.?[ \u00a0]*ú\.?[ \u00a0]*([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][\p{L}]+(?:[ \u00a0][A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][\p{L}]+)?)/u;
      function parcelUrl(num, kat) {
        var P = window.PB_PARCELY || {};
        if (kat) {
          // katastr uveden: jen katastr-přesná shoda (dvouslovný název, pak jednoslovný)
          var words = kat.split(/[ \u00a0]+/), names = [words.join(' '), words[0]];
          for (var i = 0; i < names.length; i++) {
            var rid = (P.katastr || {})[names[i] + '|' + num];
            if (rid) return { url: 'https://vdp.cuzk.gov.cz/vdp/ruian/parcely/' + rid, kat: names[i] };
          }
          return null;
        }
        var u = (P.cisla || {})[num];
        return u ? { url: u, kat: '' } : null;
      }
      function decorate(t) {
        var km = t.replace(/<[^>]+>/g, '').match(KAT_RE), katCtx = km ? km[1] : '';
        return t.split(/(<[^>]+>)/).map(function (part) {
          if (part.charAt(0) === '<') return part;
          part = part.replace(PARC_RE, function (whole, pre, num, tail, katName) {
            var r = parcelUrl(num, katName || '');
            if (!r) return whole;
            var link = '<a href="' + r.url + '" target="_blank" rel="noopener" title="Detail parcely ' + num + ' na Nahlížení do KN (VDP) ↗">' + num + '</a>';
            return pre + link + (tail || '');
          });
          part = part.replace(LV_RE, function (m, num) {
            var L = (window.PB_PARCELY || {}).lv || {}, list = null;
            if (katCtx) {
              var w = katCtx.split(/[ \u00a0]+/), names = [w.join(' '), w[0]];
              for (var i = 0; i < names.length && !list; i++) list = L[names[i] + '|' + num] || null;
            } else {
              // bez uvedeného katastru jen když je číslo LV jednoznačné napříč katastry
              var hits = Object.keys(L).filter(function (k) { return k.split('|')[1] === num; });
              if (hits.length === 1) list = L[hits[0]];
            }
            if (!list || list.length > 6) return m;   // jen malý, jednoznačný výčet; městský LV s desítkami parcel ne
            list = list.slice().sort(function (a, b) { return parseInt(a.num, 10) - parseInt(b.num, 10); });
            return m + ' (parc. ' + list.map(function (p) {
              return '<a href="' + p.url + '" target="_blank" rel="noopener" title="Detail parcely ' + p.num + ' (LV ' + num + ') na Nahlížení do KN (VDP) ↗">' + p.num + '</a>';
            }).join(', ') + ')';
          });
          return part.replace(KC_RE, '<mark class="pb-kc">$&</mark>');
        }).join('');
      }
      function inline(t) {
        t = esc(t)
          .replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[\s(])\*([^*\s][^*\n]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
        t = decorate(t);
        return t.replace(/\[(\d+)\]/g, function (m, n) {
          var s = byN[n];
          return s ? '<a class="pb-ref" href="' + esc(s.url) + '" title="' + esc(s.title) + '">[' + n + ']</a>' : m;
        });
      }
      var paras = [], list = null, ptxt = [];
      function flushP() { if (ptxt.length) { paras.push('<p>' + ptxt.map(inline).join('<br>') + '</p>'); ptxt = []; } }
      function flushL() { if (list) { paras.push('<' + list.tag + '>' + list.items.join('') + '</' + list.tag + '>'); list = null; } }
      String(text).split('\n').forEach(function (line) {
        var ul = line.match(/^\s*(?:[-*\u2022])\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
        var m = ul || ol;
        if (m) {
          flushP();
          var tag = ul ? 'ul' : 'ol';
          if (list && list.tag !== tag) flushL();
          if (!list) list = { tag: tag, items: [] };
          list.items.push('<li>' + inline(m[1]) + '</li>');
        } else if (!line.trim()) {
          flushP(); flushL();
        } else {
          flushL(); ptxt.push(line);
        }
      });
      flushP(); flushL();
      var out = paras.join('');
      if (sources.length) {
        out += '<ul class="pb-zdroje">' + sources.map(function (s) {
          return '<li>[' + s.n + '] <a href="' + esc(s.url) + '">' + esc(s.title) + '</a></li>';
        }).join('') + '</ul>';
      }
      return out;
    }

    // Mapy parcel pro odkazy v odpovědích (stejné zdroje jako sekce Pozemky a Jednání); chyba = bez odkazů.
    // lv: „katastr|číslo LV“ -> parcely, které web zná z usnesení (jednani/parcely-lv.json, API KN).
    window.PB_PARCELY = { cisla: {}, katastr: {}, lv: {} };
    Promise.all([
      fetch('/jednani/parcely-odkazy.json').then(function (r) { return r.json(); }).catch(function () { return {}; }),
      fetch('/jednani/parcely-pozemky.json').then(function (r) { return r.json(); }).catch(function () { return {}; }),
      fetch('/jednani/parcely-lv.json').then(function (r) { return r.json(); }).catch(function () { return {}; })
    ]).then(function (res) {
      var kat = (res[1] && res[1].parcely) || {}, lvSrc = (res[2] && res[2].parcely) || {}, lv = {};
      Object.keys(lvSrc).forEach(function (k) {
        var e = lvSrc[k];
        if (!e || !e.lv || !kat[k]) return;
        var key = (e.lv_katastr || k.split('|')[0]) + '|' + e.lv;
        (lv[key] = lv[key] || []).push({ num: k.split('|')[1], url: 'https://vdp.cuzk.gov.cz/vdp/ruian/parcely/' + kat[k] });
      });
      window.PB_PARCELY = { cisla: (res[0] && res[0].parcely) || {}, katastr: kat, lv: lv };
    });

    // Hodnocení odpovědi: POST {apiBase}/feedback {id, hlas}; poslední hlas platí.
    function feedbackUrl() { return apiUrl.replace(/\/chat\/?$/, '/feedback'); }

    function addVote(msgEl, id) {
      var bubble = msgEl.querySelector('.pb-bubble');
      var box = document.createElement('div');
      box.className = 'pb-vote';
      box.innerHTML = '<button type="button" data-hlas="1" aria-pressed="false" aria-label="Odpověď pomohla" title="Odpověď pomohla">👍</button>' +
        '<button type="button" data-hlas="-1" aria-pressed="false" aria-label="Odpověď nepomohla" title="Odpověď nepomohla">👎</button>' +
        '<span class="pb-vote-msg" role="status"></span>';
      var note = box.querySelector('.pb-vote-msg');
      box.addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        var hlas = Number(b.getAttribute('data-hlas'));
        var btns = box.querySelectorAll('button');
        btns.forEach(function (x) { x.disabled = true; });
        fetch(feedbackUrl(), {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({id: id, hlas: hlas})
        }).then(function (r) {
          if (!r.ok) throw new Error('hodnocení');
          btns.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
          note.textContent = 'Hodnocení uloženo.';
        }).catch(function () {
          note.textContent = 'Hodnocení se nepodařilo uložit.';
        }).then(function () { btns.forEach(function (x) { x.disabled = false; }); });
      });
      bubble.appendChild(box);
    }

    function setBusy(b) {
      busy = b;
      send.disabled = b || !apiUrl;
      status.hidden = !b;
    }

    function ask(question) {
      if (busy || !apiUrl) return;
      question = question.trim();
      if (!question) return;
      examples.hidden = true;
      addMsg('user', '<p>' + esc(question) + '</p>');
      history.push({role: 'user', content: question});
      input.value = '';
      setBusy(true);
      var thinking = addMsg('bot', '<p>…</p>', 'thinking');
      fetch(apiUrl, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({messages: history.slice(-6)})
      }).then(function (r) {
        return r.json().then(function (j) { return {ok: r.ok, body: j}; });
      }).then(function (res) {
        thinking.remove();
        if (!res.ok) {
          history.pop();
          addMsg('error', '<p>' + esc(res.body.error || 'PečkyBot teď neodpovídá. Zkuste to prosím později.') + '</p>', 'error');
          return;
        }
        history.push({role: 'assistant', content: res.body.answer});
        var el = addMsg('bot', renderAnswer(res.body.answer, res.body.sources || []));
        if ((res.body.sources || []).some(function (x) { return /^\/voda\//.test(x.url) && /cen[auí]|ceník/i.test(x.title); })) vodaGraf(el);
        if (res.body.id) addVote(el, res.body.id);
      }).catch(function () {
        thinking.remove();
        history.pop();
        addMsg('error', '<p>Spojení s PečkyBotem se nezdařilo. Zkuste to prosím znovu.</p>', 'error');
      }).then(function () { setBusy(false); input.focus(); });
    }

    form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });
    examples.addEventListener('click', function (e) {
      if (e.target.classList.contains('pb-chip')) ask(e.target.textContent);
    });

    // Adresa Workeru je v peckybot/config.json, ať se dá spustit a vypnout bez buildu.
    send.disabled = true;
    fetch('/peckybot/config.json').then(function (r) { return r.json(); }).then(function (c) {
      if (c && c.api) { apiUrl = c.api; send.disabled = false; return; }
      throw new Error('vypnuto');
    }).catch(function () {
      input.disabled = true;
      examples.hidden = true;
      addMsg('error', '<p>PečkyBot zatím není spuštěný. Zkuste to prosím později.</p>', 'error');
    });
  })();
  </script>
