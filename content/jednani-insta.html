  <a class="overlay-close" href="/jednani/" aria-label="Zavřít a vrátit se na Jednání">Zavřít</a>

  <section class="panel active" id="panel-today" aria-label="Jednání pro sociální sítě">
    <div class="today-frame" id="Frame" data-vzhled="puvodni">
      <div class="ji-nav">
        <div class="today-format" role="group" aria-label="Druh jednání">
          <button type="button" class="today-format-btn" data-druh="rada" aria-pressed="true">Rada</button>

        <div class="today-format today-dny" role="group" aria-label="Změna jednání">
          <button type="button" class="today-pismo-btn" id="ji-starsi" aria-label="Starší jednání">‹</button>
          <button type="button" class="today-pismo-btn" id="ji-novejsi" aria-label="Novější jednání">›</button>
        </div>

      <div class="today-box">
        <h3 class="search-status" id="ji-status"><span class="spinner" aria-hidden="true"></span>Načítám jednání…</h3>

          <div class="ji-live" id="ji-live" hidden></div>
          <span class="ji-pata" id="ji-pata"><span class="pata-nova">Všechna jednání na <span class="ji-url">dopecek.cz/jednani</span></span><span class="pata-stara">DoPecek.cz/jednani</span></span>
        </div>
      </div>
      <div class="today-akce">
        <div class="today-radek">
          <button type="button" class="today-pismo-btn" id="ji-pismo" aria-label="Změnit velikost písma" title="Velikost písma">Aa</button>
          <div class="today-format" role="group" aria-label="Formát obrázku">
            <button type="button" class="today-format-btn" data-f="1:1" aria-pressed="false" title="Čtverec, 1080 × 1080 px">1:1</button>
            <button type="button" class="today-format-btn" data-f="4:5" aria-pressed="true" title="Na výšku, 1080 × 1350 px">4:5</button>
            <button type="button" class="today-format-btn" data-f="3:4" aria-pressed="false" title="Vysoký, 1080 × 1440 px">3:4</button>
            <button type="button" class="today-format-btn" data-f="9:16" aria-pressed="false" title="Story / Reels, 1080 × 1920 px">9:16</button>
          </div>

          <button type="button" class="today-uloz-btn" id="today-uloz">Uložit ...</button>
          <button type="button" class="today-uloz-btn" id="today-sdilet">Sdílet ...</button>
        </div>
        <span class="today-stav" id="today-stav" role="status"></span>
      </div>
    </div>
  </section>

  <style>
    /* Rám 327 px široký (4:5 jako 1080 × 1350), karta v barvě widgetu z Domů: rada = bordó, zastupitelstvo = břidlicová modrá. */
    html,body{background:var(--ink); touch-action:manipulation;}
    body{padding-top:0;}   /* bez hlavičky: odsazení pod hlavičku z styles.css by přidalo zbytečný scroll */
    main{max-width:none; margin:0; padding:0;}
    #panel-today{position:static; display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; box-sizing:border-box; padding:110px 0 190px;}
    .today-frame{position:relative; flex:none; --k:.82; box-sizing:border-box; width:327px; aspect-ratio:var(--pomer,4 / 5); margin:12px; padding:10px; background:var(--material);}
    .today-box{position:relative; z-index:1; width:100%; height:100%;}
    .today-box .search-status{margin:0; color:#fff;}
    .ji-card{
      --banner-from:var(--burgundy); --banner-to:var(--burgundy-deep); --banner-accent:var(--burgundy);
      box-sizing:border-box; width:100%; height:100%; display:flex; flex-direction:column; align-items:flex-start; overflow:hidden;
      padding:20px 20px 14px; border-radius:16px; color:#fff; background:linear-gradient(135deg,var(--banner-from) 0%,var(--banner-to) 100%);
    }
    .ji-card[hidden]{display:none;}
    .ji-card.slate{--banner-from:var(--cyan); --banner-to:var(--cyan); --banner-accent:var(--cyan);}  /* jako .banner--slate na Domů */
    .ji-title{margin:0; font:600 calc(26px * var(--k))/1.15 var(--font-banner); color:#fff;}
    .ji-sub{margin:4px 0 12px; font:600 calc(14px * var(--k))/1.3 var(--font-body); color:rgba(255,255,255,.9);}
    .ji-card .banner-avatars{margin-bottom:12px;}
    .ji-card .rada-avatars .banner-av{width:32px; height:32px;}
    .ji-temata{margin:0 0 auto; padding:0 0 0 18px; width:100%; box-sizing:border-box; overflow:hidden; font:400 calc(13.5px * var(--k))/1.4 var(--font-body); color:rgba(255,255,255,.95); cursor:text;}
    .ji-temata:focus{outline:1px dashed #fff; outline-offset:4px;}
    .ji-temata li{margin:0 0 7px; padding:0;}
    .ji-temata a{color:#fff;}
    .ji-temata mark{background:var(--yellow); color:var(--ink); font-weight:600; padding:0 3px; border-radius:3px; -webkit-box-decoration-break:clone; box-decoration-break:clone;}
    .ji-sub.ji-meta{display:flex; flex-direction:column; gap:calc(3px * var(--k)); font-weight:600;}
    .ji-sub.ji-meta .banner-meta-item{gap:calc(7px * var(--k));}
    .ji-sub.ji-meta .kal-ico{width:calc(16px * var(--k)); height:calc(16px * var(--k)); margin-top:calc(2px * var(--k));}
    .ji-live{margin:6px 0 0;}
    .ji-live[hidden]{display:none;}
    .ji-cta{display:inline-flex; align-items:center; gap:calc(9px * var(--k)); padding:calc(9px * var(--k)) calc(16px * var(--k)); background:#fff; color:var(--banner-accent); font:700 calc(15px * var(--k))/1.2 var(--font-body); border-radius:99px; box-shadow:0 2px 0 rgba(0,0,0,.18); white-space:nowrap;}
    .ji-cta svg{flex:none; width:calc(22px * var(--k)); height:calc(22px * var(--k));}
    .ji-pata{align-self:flex-end; margin-top:8px; font:700 13px/1 var(--font-body); color:#fff;}
    .ji-nav{position:absolute; left:0; right:0; bottom:100%; margin-bottom:7px; display:flex; justify-content:space-between; align-items:center;}
    .today-format{display:flex;}
    .today-format-btn{min-width:56px; height:28px; padding:0 14px; border:1px solid rgba(255,255,255,.55); border-right-width:0; background:transparent; color:#fff; font:700 13px/1 var(--font-body); cursor:pointer;}
    .today-format-btn:first-child{border-radius:99px 0 0 99px;}
    .today-format-btn:last-child{border-radius:0 99px 99px 0; border-right-width:1px;}
    .today-format-btn:hover{background:rgba(255,255,255,.12);}
    .today-format-btn[aria-pressed="true"]{background:#fff; color:var(--ink);}
    .today-radek{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
    .today-dny .today-pismo-btn{border-radius:0; border-right-width:0; height:28px; padding:0 14px;}
    .today-dny .today-pismo-btn:first-child{border-radius:99px 0 0 99px;}
    .today-dny .today-pismo-btn:last-child{border-radius:0 99px 99px 0; border-right-width:1px;}
    .today-pismo-btn{min-width:34px; height:26px; padding:0 8px; border-radius:99px; border:1px solid rgba(255,255,255,.55); background:transparent; color:#fff; font:700 13px/1 var(--font-body); cursor:pointer;}
    .today-pismo-btn:hover{border-color:#fff; background:rgba(255,255,255,.12);}
    .today-pismo-btn:disabled{opacity:.4; cursor:default;}
    .today-akce{position:absolute; top:100%; left:0; right:0; margin-top:16px;}
    .today-akce-tl{display:flex; gap:10px; justify-content:center;}
    .today-stav{display:block; margin-top:10px; text-align:center; font:400 13px/1.3 var(--font-body); color:#fff; min-height:1.3em;}
    .today-uloz-btn{white-space:nowrap; border:1px solid #fff; border-radius:99px; background:transparent; color:#fff; font-family:var(--font-body); font-size:15px; font-weight:700; line-height:1; padding:12px 20px; cursor:pointer;}
    .today-uloz-btn:hover{background:rgba(255,255,255,.12);}
    .today-uloz-btn:disabled{opacity:.6; cursor:wait;}
    a.overlay-close{display:inline-block; text-decoration:none;}

    /* vzhled pro 9:16 (Story / Reels) jako v Kalendáři: perforace, vysoká barevná hlavička, světlé tělo s položkami oddělenými čárou;
       ostatní formáty zůstávají beze změny (atribut data-vzhled na rámu nastavuje přepínač formátu) */
    .ji-hlavicka{display:contents;}
    .ji-pata .pata-nova{display:none;}
    .today-frame[data-vzhled="novy"]{padding:0; background:var(--material);}
    .today-frame[data-vzhled="novy"] .ji-card{
      background:var(--banner-from); color:#fff; padding:0 0 calc(14px * var(--k)); border-radius:0; align-items:stretch;
    }
    .today-frame[data-vzhled="novy"] .ji-hlavicka{display:flex; flex-direction:column; align-items:flex-start; text-align:left; background:transparent; padding:calc(30px * .82 + 38px) 14px calc(16px * .82);}
    .today-frame[data-vzhled="novy"] .ji-pata{align-self:flex-end; margin:auto 14px 0 0; color:#fff; font-weight:400;}
    .today-frame[data-vzhled="novy"] .ji-pata .pata-nova{display:inline;}
    .today-frame[data-vzhled="novy"] .ji-pata .pata-stara{display:none;}
    .today-frame[data-vzhled="novy"] .ji-title, .today-frame[data-vzhled="novy"] .ji-sub{color:#fff;}
    .today-frame[data-vzhled="novy"] .ji-url{color:#fff; text-decoration:underline; font-weight:700;}
    .today-frame[data-vzhled="novy"] .ji-title{font:600 calc(34px * .82)/1.1 var(--font-banner);}
    .today-frame[data-vzhled="novy"] .ji-sub{margin:calc(6px * .82) 0 0; font:600 calc(18px * .82)/1.2 var(--font-body);}
    .today-frame[data-vzhled="novy"] .ji-live{margin:12px 14px 0;}
    .today-frame[data-vzhled="novy"] #ji-avatary{margin:12px 14px 4px;}
    .today-frame[data-vzhled="novy"] .ji-card .banner-avatars{margin:0; padding:0;}
    .today-frame[data-vzhled="novy"] #ji-avatary .banner-av{margin:0 calc(-1 * var(--av-ov, 0px)) 0 0; box-shadow:0 0 0 2px var(--banner-from);}   /* překrytí dopočítává jiAvatary(): nejvýš 2 řádky */
    .today-frame[data-vzhled="novy"] #ji-avatary .banner-avatars, .today-frame[data-vzhled="novy"] #ji-avatary .rada-avatars{justify-content:flex-start;}
    .today-frame[data-vzhled="novy"] #ji-avatary .banner-av{border:0;}
    .today-frame[data-vzhled="novy"] .ji-temata{padding:0 14px 0 32px; margin:0 0 auto; list-style:disc; color:#fff;}
    .today-frame[data-vzhled="novy"] .ji-temata:focus{outline-offset:-3px;}
    .today-frame[data-vzhled="novy"] .ji-temata li{margin:0; padding:calc(6px * var(--k)) 0 calc(6px * var(--k)) 2px;}
    .today-frame[data-vzhled="novy"] .ji-temata li::marker{color:#fff;}
    .today-frame[data-vzhled="novy"] .ji-temata a{color:inherit;}
  </style>

<script>
  // ===== Jednání: karta s tématy jednání z jednani/insta.json (generuje scripts/build.py) =====
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, ev => ev.preventDefault()));
  const JI = {data: {}, ids: [], id: '', druh: 'rada'};
  const jiSeznam = () => JI.ids.filter(x => JI.data[x].druh === JI.druh);
  // ikony jako v banneru příštího zasedání na Domů (ICO_KAL / ICO_PIN / ICO_YT ve scripts/build.py)
  const JI_ICO_KAL = '<svg class="kal-ico" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3"/></svg>';
  const JI_ICO_PIN = '<svg class="kal-ico" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 14.5s4.5-4.2 4.5-7.8a4.5 4.5 0 0 0-9 0C3.5 10.3 8 14.5 8 14.5z"/><circle cx="8" cy="6.7" r="1.6"/></svg>';
  const JI_ICO_YT = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#FF0000" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8z"/><path fill="#fff" d="M9.6 15.6V8.4l6.2 3.6z"/></svg>';
  const JI_DNY = ['Neděle', 'Pondělí', 'Úterý', 'Středa', 'Čtvrtek', 'Pátek', 'Sobota'];
  const JI_FORMATY = {'1:1': [1080, 1080], '4:5': [1080, 1350], '3:4': [1080, 1440], '9:16': [1080, 1920]};
  let JI_FORMAT = '4:5';

  function jiRender(){
    const m = JI.data[JI.id];
    if (!m) return;
    const zm = m.druh === 'zastupitelstvo';
    JI.druh = m.druh;
    document.querySelectorAll('[data-druh]').forEach(b => b.setAttribute('aria-pressed', b.dataset.druh === m.druh ? 'true' : 'false'));
    const [r, mm, d] = [m.date.slice(0, 4), +m.date.slice(5, 7), +m.date.slice(8)];
    const card = document.getElementById('ji-card');
    card.classList.toggle('slate', zm);
    // jednání, které ještě neproběhlo: den v týdnu, čas, místo, odkaz na živé vysílání a body jako v banneru na Domů
    const dnes = new Date().toISOString().slice(0, 10);
    const budouci = m.date >= dnes && m.dom;
    const sub = document.getElementById('ji-sub');
    const titulek = document.getElementById('ji-title');
    if (budouci) titulek.innerHTML = `Pozvánka na zasedání<br>${zm ? 'zastupitelstva' : 'rady'} č. ${m.number}/${m.year}`;
    else titulek.textContent = `${zm ? 'Zastupitelstvo' : 'Rada'} č. ${m.number}/${m.year}`;
    if (budouci) {
      const den = JI_DNY[new Date(+r, mm - 1, d).getDay()];
      sub.classList.add('ji-meta');
      sub.innerHTML = `<span class="banner-meta-item">${JI_ICO_KAL}<span>${den}, ${d}. ${mm}. ${r}${m.time ? ' v ' + m.time : ''}</span></span>`
        + (m.venue ? `<span class="banner-meta-item">${JI_ICO_PIN}<span>${m.venue}</span></span>` : '');
    } else {
      sub.classList.remove('ji-meta');
      sub.textContent = `${d}. ${mm}. ${r}`;
    }
    const live = document.getElementById('ji-live');
    live.hidden = !(budouci && m.dom.live);
    live.innerHTML = live.hidden ? '' : `<span class="ji-cta">${JI_ICO_YT}Živé vysílání${m.time ? ' od ' + m.time : ''} na YouTube</span>`;
    document.getElementById('ji-avatary').innerHTML = m.avatary;
    jiAvatary();
    document.getElementById('ji-temata').innerHTML = budouci && m.dom.temata ? m.dom.temata + '<li>a další...</li>' : m.temata;
    jiVejde();
    const sez = jiSeznam(), i = sez.indexOf(JI.id);
    document.getElementById('ji-starsi').disabled = i >= sez.length - 1;
    document.getElementById('ji-novejsi').disabled = i <= 0;
    history.replaceState(null, '', '#' + JI.id);
  }
  // avatary se v 9:16 podle potřeby překrývají tak, aby zabraly nejvýš 2 řádky (proměnná --av-ov = překrytí v px)
  function jiAvatary(){
    const box = document.getElementById('ji-avatary'), av = box.querySelectorAll('.banner-av');
    box.style.removeProperty('--av-ov');
    if (document.getElementById('Frame').dataset.vzhled !== 'novy' || !av.length) return;
    const w = box.clientWidth, a = av[0].offsetWidth, naRadek = Math.ceil(av.length / 2);
    if (naRadek * a > w) box.style.setProperty('--av-ov', (a - w / naRadek + 0.5) + 'px');
  }
  // obsah pozvánky se někdy nevejde do karty (delší titulek, „a další...“): zmenšuje písmo, dokud se nevejde (min. 0,6)
  function jiVejde(){
    if (!JI.data[JI.id] || !JI.data[JI.id].dom || JI.data[JI.id].date < new Date().toISOString().slice(0, 10)) return;
    const f = document.getElementById('Frame'), t = document.getElementById('ji-temata');
    let k = 0.82;      // výchozí velikost; ruční změna tlačítkem Aa platí do dalšího přepnutí jednání nebo formátu
    const av = document.getElementById('ji-avatary');
    av.hidden = false;
    f.style.setProperty('--k', k);
    const zmensi = () => { while (t.scrollHeight > t.clientHeight + 1 && k > 0.6) { k = Math.round((k - 0.02) * 100) / 100; f.style.setProperty('--k', k); } };
    zmensi();
    // ve čtverci (1:1) se ani při nejmenším písmu nevejde všechno: avatary se vynechají a písmo se vrátí
    if (t.scrollHeight > t.clientHeight + 1 && !av.hidden) { av.hidden = true; k = 0.82; f.style.setProperty('--k', k); zmensi(); }
  }
  function jiPosun(o){
    const sez = jiSeznam(), i = sez.indexOf(JI.id) + o;
    if (i < 0 || i >= sez.length) return;
    JI.id = sez[i];
    jiRender();
  }
  document.getElementById('ji-starsi').addEventListener('click', () => jiPosun(1));
  document.getElementById('ji-novejsi').addEventListener('click', () => jiPosun(-1));
  // swipe na mobilu: doleva = starší jednání, doprava = novější (převážně vodorovné gesto ≥ 50 px)
  (function(){
    const frame = document.getElementById('Frame');
    let sx = 0, sy = 0, st = 0, sledovat = false;
    frame.addEventListener('touchstart', ev => {
      sledovat = ev.touches.length === 1;
      if (!sledovat) return;
      sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; st = Date.now();
    }, {passive:true});
    frame.addEventListener('touchend', ev => {
      if (!sledovat) return;
      sledovat = false;
      const t = ev.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Date.now() - st > 800 || Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      const sel = window.getSelection();
      if (sel && !sel.isCollapsed) return;
      jiPosun(dx < 0 ? 1 : -1);
    }, {passive:true});
    frame.style.touchAction = 'pan-y';
  })();
  document.querySelectorAll('[data-druh]').forEach(b => b.addEventListener('click', () => {
    JI.druh = b.dataset.druh;
    JI.id = jiSeznam()[0];
    jiRender();
  }));

  const JI_VELIKOSTI = [0.7, 0.82, 0.95];
  document.getElementById('ji-pismo').addEventListener('click', () => {
    const f = document.getElementById('Frame');
    const k = parseFloat(getComputedStyle(f).getPropertyValue('--k')) || 0.82;
    const i = JI_VELIKOSTI.reduce((n, v, j) => Math.abs(v - k) < Math.abs(JI_VELIKOSTI[n] - k) ? j : n, 0);
    f.style.setProperty('--k', JI_VELIKOSTI[(i + 1) % JI_VELIKOSTI.length]);
  });
  document.querySelectorAll('.today-format-btn[data-f]').forEach(b => b.addEventListener('click', () => {
    JI_FORMAT = b.dataset.f;
    const [w, h] = JI_FORMATY[JI_FORMAT];
    document.getElementById('Frame').style.setProperty('--pomer', w + ' / ' + h);
    document.getElementById('Frame').dataset.vzhled = JI_FORMAT === '9:16' ? 'novy' : 'puvodni';
    jiAvatary();
    jiVejde();
    document.querySelectorAll('.today-format-btn[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  }));
  document.getElementById('ji-temata').addEventListener('paste', ev => {
    ev.preventDefault();
    document.execCommand('insertText', false, (ev.clipboardData || window.clipboardData).getData('text/plain'));
  });

  // export bloku #Frame do PNG (stejný postup jako Kalendář → insta): klon s vloženými vypočtenými styly → SVG foreignObject → canvas
  const JI_SKRYT = '.ji-nav, .today-akce';
  async function jiFramePng(){
    const orig = document.getElementById('Frame');
    const clone = orig.cloneNode(true);
    clone.querySelectorAll(JI_SKRYT).forEach(n => n.remove());
    const c = [clone, ...clone.querySelectorAll('*')];
    [orig, ...orig.querySelectorAll('*')].filter(n => !n.closest(JI_SKRYT)).forEach((n, i) => {
      const cs = getComputedStyle(n);
      for (const name of cs) c[i].style.setProperty(name, cs.getPropertyValue(name));
    });
    clone.style.position = 'static'; clone.style.margin = '0';
    // fotky se před vložením do SVG zmenší (čtverec 160 px, ořez na střed jako object-fit:cover) a dekódují;
    // velké portréty ve foreignObject Safari často nestihne vykreslit a avatar zůstane prázdný
    for (const img of clone.querySelectorAll('img')) {
      const zdroj = new Image();
      zdroj.src = URL.createObjectURL(await (await fetch(img.src)).blob());
      await zdroj.decode();
      const S = 160, k = Math.max(S / zdroj.naturalWidth, S / zdroj.naturalHeight);
      const c = document.createElement('canvas');
      c.width = c.height = S;
      c.getContext('2d').drawImage(zdroj, (S - zdroj.naturalWidth * k) / 2, (S - zdroj.naturalHeight * k) / 2, zdroj.naturalWidth * k, zdroj.naturalHeight * k);
      URL.revokeObjectURL(zdroj.src);
      img.src = c.toDataURL('image/png');
    }
    clone.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    const w = orig.offsetWidth, h = orig.offsetHeight;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%">${new XMLSerializer().serializeToString(clone)}</foreignObject></svg>`;
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    const canvas = document.createElement('canvas');
    [canvas.width, canvas.height] = JI_FORMATY[JI_FORMAT];
    const ctx = canvas.getContext('2d');
    await img.decode().catch(() => {});
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    // Safari při prvním vykreslení SVG často vynechá vložené obrázky; po chvíli se nakreslí znovu
    await new Promise(r => setTimeout(r, 150));
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return new Promise(res => canvas.toBlob(res, 'image/png'));
  }
  function jiStav(t){ document.getElementById('today-stav').textContent = t; }
  function jiStahni(blob, nazev){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nazev;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  document.getElementById('today-uloz').addEventListener('click', async ev => {
    const b = ev.currentTarget;
    b.disabled = true; jiStav('');
    try { jiStahni(await jiFramePng(), `instagram-${JI.id}.png`); }
    catch (e) { jiStav('Obrázek se nepodařilo vytvořit.'); }
    b.disabled = false;
  });
  document.getElementById('today-sdilet').addEventListener('click', async ev => {
    const b = ev.currentTarget, nazev = `instagram-${JI.id}.png`;
    b.disabled = true; jiStav('');
    try {
      const blob = await jiFramePng();
      const soubor = new File([blob], nazev, {type: 'image/png'});
      if (navigator.canShare && navigator.canShare({files: [soubor]})) {
        await navigator.share({files: [soubor]});
      } else {
        jiStahni(blob, nazev);
        jiStav('Sdílení není v tomto zařízení dostupné. Obrázek je stažený, nahrajte ho v aplikaci Instagram.');
      }
    } catch (e) {
      if (e && e.name !== 'AbortError') jiStav('Obrázek se nepodařilo sdílet.');
    }
    b.disabled = false;
  });

  fetch('/jednani/insta.json')
    .then(r => r.json())
    .then(data => {
      JI.data = data;
      JI.ids = Object.keys(data).sort((a, b) => data[b].date.localeCompare(data[a].date));
      const z = location.hash.slice(1);
      JI.id = data[z] ? z : JI.ids[0];
      document.getElementById('ji-status').style.display = 'none';
      document.getElementById('ji-card').hidden = false;
      jiRender();
    })
    .catch(() => { document.getElementById('ji-status').textContent = 'Jednání se nepodařilo načíst.'; });
</script>
